
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 22px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        .logout-btn {
            background: white;
            color: #2563eb;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #dbeafe;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0000000d;
        }

        .welcome h2 {
            margin-top: 0;
        }

        .role {
            display: inline-block;
            padding: 7px 12px;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 20px;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0000000d;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card h3 {
            color: #2563eb;
            margin-top: 0;
        }

        .card-link {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .card-link:hover .card {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px #00000018;
        }

        .open-link {
            display: inline-block;
            margin-top: 8px;
            color: #2563eb;
            font-weight: bold;
        }

        .coming-soon {
            display: inline-block;
            margin-top: 8px;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            header h1 {
                font-size: 19px;
            }

            .container {
                margin: 20px auto;
                padding: 0 14px;
            }

            .welcome,
            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Online Project Management System</h1>
    <a th:href="@{/logout}" class="logout-btn">Logout</a>
</header>

<div class="container">

    <div class="welcome">
        <h2>
            Welcome, <span th:text="${name}">User</span>!
        </h2>

        <p>You have successfully logged in.</p>

        <p>
            Your role:
            <span class="role" th:text="${role}">TEAM_MEMBER</span>
        </p>
    </div>

    <div class="cards">

        <!-- Projects -->
        <a href="/projects" class="card-link">
            <div class="card">
                <h3>Projects</h3>
                <p>View and manage your projects.</p>
                <span class="open-link">Open Projects →</span>
            </div>
        </a>

        <!-- Tasks -->
        <a href="/tasks" class="card-link">
            <div class="card">
                <h3>Tasks</h3>
                <p>Track tasks and monitor progress.</p>
                <span class="open-link">Open Tasks →</span>
            </div>
        </a>

        <!-- Activity -->
        <div class="card">
            <h3>Activity</h3>
            <p>Keep track of project activities.</p>
            <span class="coming-soon">Coming soon</span>
        </div>

    </div>

</div>

</body>
</html>
