
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Form | Project Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px #00000012;
        }

        h1 {
            margin-top: 0;
            color: #1d4ed8;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        button, .cancel {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .cancel {
            background: #e2e8f0;
            color: #1e293b;
        }

        .error {
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 7px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1 th:text="${pageTitle}">Add Task</h1>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="${formAction}" method="post">

        <input type="hidden" name="id"
               th:if="${task.id > 0}"
               th:value="${task.id}">

        <label for="title">Task Title</label>
        <input type="text" id="title" name="title"
               th:value="${task.title}"
               maxlength="150" required>

        <label for="description">Description</label>
        <textarea id="description" name="description"
                  maxlength="2000"
                  th:text="${task.description}"
                  required></textarea>

        <label for="status">Task Status</label>
        <select id="status" name="status" required>
            <option value="PENDING"
                    th:selected="${task.status == 'PENDING'}">
                Pending
            </option>
            <option value="IN_PROGRESS"
                    th:selected="${task.status == 'IN_PROGRESS'}">
                In Progress
            </option>
            <option value="COMPLETED"
                    th:selected="${task.status == 'COMPLETED'}">
                Completed
            </option>
        </select>

        <div class="buttons">
            <button type="submit">Save Task</button>
            <a class="cancel" href="/tasks">Cancel</a>
        </div>

    </form>

</div>
</body>
</html>
