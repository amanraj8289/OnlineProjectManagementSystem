
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Project Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            color: #1d4ed8;
            margin: 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .add-btn, .edit-btn {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .back-btn {
            background: #e2e8f0;
            color: #1e293b;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            background: #dcfce7;
            color: #166534;
            border-radius: 7px;
        }

        .error {
            padding: 12px;
            margin-bottom: 18px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 7px;
        }

        .project-card {
            background: white;
            padding: 22px;
            margin-bottom: 16px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .project-card h2 {
            margin-top: 0;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .empty {
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 12px;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>All Projects</h1>

        <div>
            <a class="btn add-btn" href="/projects/new">+ Add Project</a>
            <a class="btn back-btn" href="/login">Back</a>
        </div>
    </div>

    <p class="message" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div th:if="${#lists.isEmpty(projects)}" class="empty">
        <h2>No Projects Yet</h2>
        <p>Create your first project using the Add Project button.</p>
    </div>

    <div th:each="project : ${projects}" class="project-card">

        <h2 th:text="${project.name}">Project Name</h2>

        <p class="description"
           th:text="${project.description}">Description</p>

        <span class="status" th:text="${project.status}">ACTIVE</span>

        <p>
            <strong>Project ID:</strong>
            <span th:text="${project.id}">1</span>
        </p>

        <div class="actions">
            <a class="btn edit-btn"
               th:href="@{/projects/edit(id=${project.id})}">
                Edit
            </a>

            <form th:action="@{/projects/delete}" method="post"
                  onsubmit="return confirm('Are you sure you want to delete this project?');">

                <input type="hidden" name="id" th:value="${project.id}">

                <button class="btn delete-btn" type="submit">
                    Delete
                </button>
            </form>
        </div>

    </div>

</div>
</body>
</html>
