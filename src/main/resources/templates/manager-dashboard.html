
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        header {
            background: #0f766e;
            color: white;
            padding: 22px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        header h1 { margin: 0; font-size: 24px; }
        .logout {
            background: white;
            color: #0f766e;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .container { max-width: 1000px; margin: 35px auto; padding: 0 20px; }
        .welcome, .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0000000d;
        }
        .welcome h2 { margin-top: 0; }
        .role {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #ccfbf1;
            color: #115e59;
            font-weight: bold;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .card h3 { color: #0f766e; margin-top: 0; }
        .card a { color: #0f766e; font-weight: bold; text-decoration: none; }
        @media (max-width: 600px) {
            header { padding: 20px; }
            header h1 { font-size: 19px; }
        }
    </style>
</head>
<body>
<header>
    <h1>Project Manager Dashboard</h1>
    <a th:href="@{/logout}" class="logout">Logout</a>
</header>

<main class="container">
    <section class="welcome">
        <h2>Welcome, <span th:text="${name}">Project Manager</span>!</h2>
        <p>Manage projects and track team tasks from here.</p>
        <p>Your role: <span class="role" th:text="${role}">PROJECT_MANAGER</span></p>
    </section>

    <section class="cards">
        <div class="card">
            <h3>Projects</h3>
            <p>Review and manage project progress.</p>
            <a th:href="@{/projects}">Open Projects →</a>
        </div>

        <div class="card">
            <h3>Tasks</h3>
            <p>Track tasks and monitor their status.</p>
            <a th:href="@{/tasks}">Open Tasks →</a>
        </div>
    </section>
</main>
</body>
</html>
